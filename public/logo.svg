<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <!-- Background -->
  <rect width="320" height="320" rx="24" fill="#0e0c0b"/>

  <!-- Chef Hat on top -->
  <g id="chef-hat" stroke="#e2417e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hat band -->
    <path d="M 132 54 C 142 56 162 56 172 54 C 172 58 171 61 170 63 C 160 65 144 65 134 63 Z" fill="#e2417e" fill-opacity="0.15" />
    <!-- Three Puffs -->
    <path d="M 133 54 C 118 48 120 32 135 30 C 142 22 162 22 169 30 C 184 32 186 48 171 54" />
    <!-- Inner crease lines -->
    <path d="M 143 33 C 144 43 145 52 144 56" />
    <path d="M 161 33 C 160 43 159 52 160 56" />
  </g>

  <!-- Fork on the Left -->
  <g id="fork" fill="#e2417e">
    <!-- 4 Tines -->
    <rect x="88" y="75" width="2.5" height="24" rx="1.2" />
    <rect x="93" y="75" width="2.5" height="24" rx="1.2" />
    <rect x="98" y="75" width="2.5" height="24" rx="1.2" />
    <rect x="103" y="75" width="2.5" height="24" rx="1.2" />
    <!-- Fork Base bridge -->
    <path d="M 87 96 C 87 106 104 106 104 96 Z" />
    <!-- Fork Stem / Handle -->
    <path d="M 94.5 104 L 94.5 136 C 94.5 140 93.5 146 95.5 147 C 97.5 147 96.5 140 96.5 136 L 96.5 104 Z" />
  </g>

  <!-- Spoon on the Right -->
  <g id="spoon" fill="#e2417e">
    <!-- Spoon Bowl -->
    <ellipse cx="225" cy="90" rx="9" ry="16" />
    <!-- Spoon Handle -->
    <path d="M 223.8 104 L 223.8 136 C 223.8 140 222.8 146 225 147 C 227.2 146 226.2 140 226.2 136 L 226.2 104 Z" />
  </g>

  <!-- 3D Gift Box in Center -->
  <g id="gift-box" transform="translate(112, 62)">
    <!-- Box Front Face -->
    <polygon points="0,32 46,46 46,88 0,74" fill="#fbb6ce" stroke="#d53f8c" stroke-width="1.5" />
    <!-- Box Right Face -->
    <polygon points="46,46 92,32 92,74 46,88" fill="#f472b6" stroke="#d53f8c" stroke-width="1.5" />
    <!-- Box Lid Front Rim -->
    <polygon points="-3,28 46,43 46,50 -3,35" fill="#f687b3" stroke="#d53f8c" stroke-width="1" />
    <!-- Box Lid Right Rim -->
    <polygon points="46,43 95,28 95,35 46,50" fill="#ec4899" stroke="#d53f8c" stroke-width="1" />
    <!-- Box Lid Top Face -->
    <polygon points="46,14 95,28 46,43 -3,28" fill="#fbcfe8" stroke="#d53f8c" stroke-width="1.5" />

    <!-- Ribbon Vertical (Front) -->
    <polygon points="20,38 27,40 27,82 20,80" fill="#e2417e" />
    <!-- Ribbon Vertical (Right) -->
    <polygon points="65,40 72,38 72,80 65,82" fill="#be185d" />
    <!-- Ribbon Across Lid (Left to Center to Right) -->
    <polygon points="19,21 27,23 72,34 64,32" fill="#e2417e" />
    <polygon points="42,15 50,15 50,42 42,42" fill="#be185d" />

    <!-- Ribbon Bow loops on top -->
    <path d="M 46 20 C 32 6 22 18 42 22 Z" fill="#e2417e" />
    <path d="M 46 20 C 60 6 70 18 50 22 Z" fill="#e2417e" />
    <circle cx="46" cy="20" r="4.5" fill="#be185d" />
  </g>

  <!-- "Rachy" Bold Script Wordmark -->
  <g id="brand-rachy" fill="#e2417e">
    <text x="160" y="208" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', cursive, sans-serif" font-weight="bold" font-size="52" letter-spacing="1">
      Rachy
    </text>
  </g>

  <!-- "Eats & Treats" Tagline -->
  <text x="160" y="238" text-anchor="middle" font-family="'Work Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#e2417e" letter-spacing="3.5">
    Eats &amp; Treats
  </text>

  <!-- Phone Number -->
  <text x="160" y="264" text-anchor="middle" font-family="'Work Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#e2417e" letter-spacing="1">
    07014995254
  </text>
</svg>
